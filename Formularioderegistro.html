

    <h1>Formulario de Registro</h1>

    <form id="formRegistro">

        <!-- Nombre completo -->
        <label for="nombre">Nombre completo:</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre completo"
            required
        >

        <br><br>

        <!-- Correo electrónico -->
        <label for="correo">Correo electrónico:</label>
        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required
        >

        <br><br>

        <!-- Contraseña -->
        <label for="contrasena">Contraseña:</label>
        <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Escribe tu contraseña"
            required
        >

        <br><br>

        <!-- Edad -->
        <label for="edad">Edad:</label>
        <input
            type="number"
            id="edad"
            name="edad"
            min="18"
            max="100"
            placeholder="18"
            required
        >

        <br><br>

        <!-- Fecha de nacimiento -->
        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input
            type="date"
            id="fechaNacimiento"
            name="fechaNacimiento"
            required
        >

        <br><br>

        <!-- Género -->
        <label>Género:</label>

        <input
            type="radio"
            id="masculino"
            name="genero"
            value="masculino"
            required
        >
        <label for="masculino">Masculino</label>

        <input
            type="radio"
            id="femenino"
            name="genero"
            value="femenino"
        >
        <label for="femenino">Femenino</label>

        <input
            type="radio"
            id="otro"
            name="genero"
            value="otro"
        >
        <label for="otro">Otro</label>

        <br><br>

        <!-- Intereses -->
        <label>Intereses:</label>

        <br>

        <input
            type="checkbox"
            id="programacion"
            name="intereses"
            value="programacion"
        >
        <label for="programacion">Programación</label>

        <br>

        <input
            type="checkbox"
            id="videojuegos"
            name="intereses"
            value="videojuegos"
        >
        <label for="videojuegos">Videojuegos</label>

        <br>

        <input
            type="checkbox"
            id="redes"
            name="intereses"
            value="redes"
        >
        <label for="redes">Redes</label>

        <br><br>

        <!-- Fotografía -->
        <label for="fotografia">Fotografía de perfil:</label>
        <input
            type="file"
            id="fotografia"
            name="fotografia"
            accept="image/*"
        >

        <br><br>

        <!-- Color favorito -->
        <label for="colorFavorito">Color favorito:</label>
        <input
            type="color"
            id="colorFavorito"
            name="colorFavorito"
            value="#0000ff"
        >

        <br><br>

        <!-- Nivel de satisfacción -->
        <label for="satisfaccion">
            Nivel de satisfacción:
        </label>

        <input
            type="range"
            id="satisfaccion"
            name="satisfaccion"
            min="1"
            max="10"
            value="5"
        >

        <br><br>

        <!-- Botón Registrar -->
        <button type="submit">Registrar</button>

    </form>
